name: Profile stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:            # botón "Run workflow"
  push:
    branches: [main]
    paths: ["stats/**", ".github/workflows/profile-stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar tarjetas
        env:
          STATS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python stats/generate.py

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-card.svg stats-terminal.svg
          git diff --staged --quiet || (git commit -m "chore: update profile stats" && git push)
